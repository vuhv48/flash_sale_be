server:
  port: 8088

spring:
  application:
    name: flash-sale
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flash_sale}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

app:
  mail:
    from: ${MAIL_FROM:}
    admin-notification-address: ${ADMIN_NOTIFICATION_EMAIL:}
  security:
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002}
    permit-all:
      - method: POST
        path: /api/auth/login
      - method: POST
        path: /api/auth/register
      - method: POST
        path: /api/auth/refresh
      - method: GET
        path: /actuator/health
      - method: GET
        path: /swagger-ui.html
      - method: GET
        path: /swagger-ui/**
      - method: GET
        path: /v3/api-docs
      - method: GET
        path: /v3/api-docs/**
      - method: GET
        path: /v3/api-docs.yaml
    jwt:
      secret: ${JWT_SECRET:dev-only-change-in-production-min-32-chars-ok}
      issuer: flash-sale
      expiration-seconds: 86400
      refresh-expiration-seconds: 604800
